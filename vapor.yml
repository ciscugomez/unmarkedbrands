id: 49016
name: unmarked
environments:
    production:
        domain: unmarkedbrands.com
        memory: 1024
        cli-memory: 512
        storage: unmarked-prod-files
        database: iworking_master_db
        runtime: 'php-8.2:al2'
        timeout: 900
        build:
            - 'composer install --no-dev'
            - 'php artisan event:cache'
            - 'npm ci && npm run build && rm -rf node_modules'
    staging:
        domain: staging.unmarkedbrands.com
        database: iworking_master_db
        memory: 1024
        cli-memory: 512
        storage: unmarked-staging-files
        runtime: 'php-8.2:al2'
        timeout: 900
        build:
            - 'composer install'
            - 'php artisan event:cache'
            - 'npm run build -- --mode staging'
